<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embervale viewer (dev)</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1a24; color: #e8e2d6; font: 13px/1.4 system-ui, sans-serif; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      #labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: #cfc6b4; text-shadow: 0 0 3px #000; }
      #labels span.gold { color: #f1c24a; font-weight: 600; }
      #panel { position: fixed; top: 10px; left: 10px; width: 260px; max-height: calc(100% - 20px); overflow: auto; background: #2a2533e6; border-radius: 8px; padding: 10px 12px; }
      #panel.hidden { display: none; }
      #panel h1 { font-size: 15px; margin: 0 0 6px; }
      #panel .note { color: #a99f90; font-size: 12px; margin: 4px 0 8px; }
      #panel label { display: grid; grid-template-columns: 74px 1fr 40px; gap: 6px; align-items: center; margin: 3px 0; }
      #panel select, #panel button { font: inherit; background: #3a3347; color: inherit; border: 0; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
      #panel h2 { font-size: 12px; margin: 10px 0 2px; color: #a99f90; text-transform: uppercase; letter-spacing: 0.04em; }
      #panel .joint { margin: 4px 0; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <div id="panel"></div>
    <script type="module" src="/src/dev/viewer.ts"></script>
  </body>
</html>
